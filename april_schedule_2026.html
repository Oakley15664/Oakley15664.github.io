<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四月排班表 2026 (完整修正版)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #8CABD9; --blue-dark: #5e82b8; --blue-light: #dce9f7; --navy: #1D4D9F; --pink: #F6A7B8; --pink-light: #fde8ef; --yellow: #F1EC7A; --yellow-light: #fdfbe6; --orange: #F08838; --orange-light: #fef0e2; --cream: #fafaf7; --cream-dark: #f0ece4; --border: #c8d8ee; --gray: #7a8eac; --white: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; background: var(--cream); color: var(--navy); min-height: 100vh; padding: 28px 16px 60px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
    .title-main { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--navy); }
    .title-sub { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--blue-dark); letter-spacing: 2px; margin-top: 3px; }
    .name-block { display: flex; align-items: center; gap: 10px; background: var(--blue); color: var(--navy); border-radius: 8px; padding: 8px 18px; border: 1.5px solid var(--blue-dark); }
    .name-label { font-size: 10px; opacity: 0.65; letter-spacing: 1px; font-weight: 700; }
    .name-input { background: transparent; border: none; color: var(--navy); font-size: 14px; font-weight: 700; outline: none; width: 110px; border-bottom: 1.5px solid rgba(29, 77, 159, 0.35); }
    .stats-bar { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
    .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 10px 20px; min-width: 120px; box-shadow: 0 2px 8px rgba(140, 171, 217, 0.15); }
    .stat-label { font-size: 10px; color: var(--gray); letter-spacing: 1px; }
    .stat-value { font-family: 'DM Mono', monospace; font-size: 24px; font-weight: 700; color: var(--navy); margin-top: 2px; }
    .stat-card.accent .stat-value { color: var(--orange); }
    /* 總場次卡片顏色區分 */
    .stat-card.total .stat-value { color: var(--blue-dark); }
    .week-block { background: var(--white); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 3px 18px rgba(140, 171, 217, 0.18); }
    .sg { display: grid; grid-template-columns: 76px repeat(10, 1fr) 58px 68px; }
    .cell { padding: 6px 3px; text-align: center; font-size: 11px; display: flex; align-items: center; justify-content: center; min-height: 30px; border-right: 1px solid rgba(140, 171, 217, 0.35); border-bottom: 1px solid rgba(140, 171, 217, 0.2); }
    .r-dates { background: var(--blue); }
    .c-week-label, .c-date, .c-sum-hdr { font-size: 15px; font-weight: 700; color: var(--navy); }
    .c-date.hol { background: var(--pink-light) !important; color: #b03060 !important; }
    .c-date .wd { font-size: 15px; opacity: 0.6; display: block; }
    .r-slots { background: var(--blue-light); }
    .c-slot, .c-slot-lbl { font-size: 15px; font-weight: 700; color: var(--navy); }
    .r-times { background: #edf4fb; border-bottom: 2px solid var(--border); }
    .c-time { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--navy); font-weight: 700; }
    .c-time.hol { color: #b03060; }
    .r-person { background: var(--cream); }
    .c-person-lbl { font-size: 15px; font-weight: 700; color: var(--navy); background: var(--yellow-light); }
    .att { cursor: pointer; font-size: 15px; font-weight: 700; transition: all 0.12s; user-select: none; min-height: 38px; }
    .att.on { background: var(--yellow-light); color: #7a6e00; }
    .att.off { background: #f8f8f8; color: #ccc; }
    .att.hol { background: var(--pink-light); color: #f0b8c4; cursor: not-allowed; }
    .c-wk-total { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 600; background: var(--yellow-light); }
    .c-mo-total { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 700; color: var(--white); background: var(--orange); }
    .print-btn { background: var(--orange); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 15px; font-weight: 700; cursor: pointer; margin-left: 5px; }
    @media print { .print-btn { display: none; } .name-input { border: none; } }
  </style>
</head>

<body>
  <div class="page-header">
    <div>
      <div class="title-main">四月排班表</div>
      <div class="title-sub">APRIL · 2026</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="name-block">
        <span class="name-label">姓名</span>
        <input class="name-input" id="nameInput" placeholder="輸入名字">
      </div>
      <button class="print-btn" onclick="window.print()">🖨 列印</button>
      <button class="print-btn" style="background:#7a8eac;" onclick="clearData()">🔄 重置</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">已出勤場次</div>
      <div class="stat-value" id="statPresent">0</div>
    </div>
    <div class="stat-card accent">
      <div class="stat-label">本月累積時數</div>
      <div class="stat-value" id="statHours">0</div>
    </div>
    <div class="stat-card total">
      <div class="stat-label">本月可填場次</div>
      <div class="stat-value" id="statTotalSlots">0</div>
    </div>
  </div>

  <div id="scheduleContainer"></div>

  <script>
    const HOLIDAYS = { 1: '溫書假', 2: '調整放假', 3: '兒童節補假', 6: '掃墓節補假' };
    const SLOTS = [{ name: '早上', time: '7:00-8:00' }, { name: '中午', time: '12:20-13:20' }];
    const WEEK_NAMES = ['一', '二', '三', '四', '五'];
    const WD_NAMES = ['(一)', '(二)', '(三)', '(四)', '(五)'];

    function buildWeeks() {
      const weeks = [];
      let week = Array(5).fill(null), started = false;
      let totalSlots = 0; // 用於計算總時段

      for (let d = 1; d <= 30; d++) {
        const wd = new Date(2026, 3, d).getDay();
        if (wd === 0 || wd === 6) continue;
        
        const idx = wd - 1;
        if (idx === 0 && started) { weeks.push(week); week = Array(5).fill(null); }
        week[idx] = d;
        started = true;

        // 如果不是假日，則增加 2 個可用時段（早上、中午）
        if (!HOLIDAYS[d]) {
          totalSlots += 2;
        }
      }
      if (week.some(v => v !== null)) weeks.push(week);
      return { weeks, totalSlots };
    }

    const buildResult = buildWeeks();
    const weeks = buildResult.weeks;
    const totalAvailableSlots = buildResult.totalSlots;

    let state = JSON.parse(localStorage.getItem('schedule_data_2026_04')) || weeks.map(wk => wk.map(() => [false, false]));
    let savedName = localStorage.getItem('schedule_name_2026_04') || "";

    function mk(tag, cls, html) {
      const el = document.createElement(tag);
      el.className = cls;
      if (html !== undefined) el.innerHTML = html;
      return el;
    }

    function render() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      const currentName = document.getElementById('nameInput').value || '（你的名字）';
      let cumTotal = 0;

      weeks.forEach((week, wi) => {
        const block = mk('div', 'week-block');

        // 第一列：日期
        const r1 = mk('div', 'sg r-dates');
        r1.appendChild(mk('div', 'cell c-week-label', `第${WEEK_NAMES[wi]}週`));
        week.forEach((day, di) => {
          const isEmpty = day === null, isHol = !isEmpty && !!HOLIDAYS[day];
          const c = mk('div', 'cell c-date' + (isEmpty ? ' emp' : isHol ? ' hol' : ''), isEmpty ? '' : `4/${day}<span class="wd">${WD_NAMES[di]}${isHol ? ' · ' + HOLIDAYS[day] : ''}</span>`);
          c.style.gridColumn = 'span 2';
          r1.appendChild(c);
        });
        r1.appendChild(mk('div', 'cell c-sum-hdr', '本週<br>時數'));
        r1.appendChild(mk('div', 'cell c-sum-hdr', '累積<br>時數'));
        block.appendChild(r1);

        // 第二列：時段 (早上/中午)
        const r2 = mk('div', 'sg r-slots');
        r2.appendChild(mk('div', 'cell c-slot-lbl', '服務時段'));
        week.forEach((day) => {
          SLOTS.forEach(s => {
            const isHol = day !== null && !!HOLIDAYS[day];
            r2.appendChild(mk('div', 'cell c-slot' + (day === null ? ' emp' : isHol ? ' hol' : ''), day === null ? '' : s.name));
          });
        });
        r2.appendChild(mk('div', 'cell')); r2.appendChild(mk('div', 'cell'));
        block.appendChild(r2);

        // 第三列：具體時間
        const r3 = mk('div', 'sg r-times');
        r3.appendChild(mk('div', 'cell c-slot-lbl', '服務時間'));
        week.forEach((day) => {
          SLOTS.forEach(s => {
            const isHol = day !== null && !!HOLIDAYS[day];
            r3.appendChild(mk('div', 'cell c-time' + (day === null ? ' emp' : isHol ? ' hol' : ''), day === null ? '' : s.time));
          });
        });
        r3.appendChild(mk('div', 'cell')); r3.appendChild(mk('div', 'cell'));
        block.appendChild(r3);

        // 第四列：簽到 (1/X)
        const r4 = mk('div', 'sg r-person');
        r4.appendChild(mk('div', 'cell c-person-lbl name-cell', currentName));
        let wkCount = 0;
        week.forEach((day, di) => {
          SLOTS.forEach((_, si) => {
            const c = mk('div', 'cell att');
            if (day === null) { c.classList.add('emp'); }
            else if (HOLIDAYS[day]) { c.classList.add('hol'); }
            else {
              const on = state[wi][di][si];
              c.classList.add(on ? 'on' : 'off');
              c.textContent = on ? '1' : 'X';
              if (on) wkCount++;
              c.onclick = () => { 
                state[wi][di][si] = !state[wi][di][si]; 
                saveData(); 
                render(); 
              };
            }
            r4.appendChild(c);
          });
        });
        cumTotal += wkCount;
        r4.appendChild(mk('div', 'cell c-wk-total', wkCount));
        r4.appendChild(mk('div', 'cell c-mo-total', cumTotal));
        block.appendChild(r4);

        container.appendChild(block);
      });

      document.getElementById('statPresent').textContent = cumTotal;
      document.getElementById('statHours').textContent = cumTotal;
      // 顯示總可用場次
      document.getElementById('statTotalSlots').textContent = totalAvailableSlots;
    }

    function saveData() {
      localStorage.setItem('schedule_data_2026_04', JSON.stringify(state));
      localStorage.setItem('schedule_name_2026_04', document.getElementById('nameInput').value);
    }

    function clearData() {
      if(confirm("確定要清除所有紀錄嗎？")) {
        localStorage.clear();
        location.reload();
      }
    }

    const nameInput = document.getElementById('nameInput');
    nameInput.value = savedName;
    nameInput.addEventListener('input', () => { saveData(); render(); });

    render();
  </script>
</body>
</html>
